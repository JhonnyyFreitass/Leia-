<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leia+ · Leitor de livros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Literata:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
:root{
  --bg:#000000; --surface:#121212; --ink:#FFF1E4; --mut:#A89A8B; --or:#FF7A1A; --or2:#FF9A45; --or3:#B84A00;
  --line:rgba(255,255,255,.16); --chip:#1B1B1B; --on-or:#000000; --shadow:0 6px 24px rgba(0,0,0,.6);
  --btn-hi:rgba(255,255,255,.35); --btn-edge:#7A2E00; --dk-face:linear-gradient(180deg,#2a2a2a,#141414); --dk-edge:#000;
  --fs:19px; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --mut:#5F5F5F; --or:#F26A00; --or2:#FF8A1F; --or3:#C24E00;
  --line:rgba(0,0,0,.14); --chip:#F1F1F1; --shadow:0 6px 24px rgba(0,0,0,.14);
  --dk-face:linear-gradient(180deg,#ffffff,#eeeeee); --dk-edge:#cfcfcf;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--or);outline-offset:2px}
svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:4px}
.mark{width:14px;height:22px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--or2),var(--or) 60%,#000);display:inline-block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;padding:10px 0}
.search input:focus-visible{outline:none}
.search:focus-within{border-color:var(--or);box-shadow:0 0 0 3px color-mix(in srgb,var(--or) 30%,transparent)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.ib:hover{border-color:var(--or)}
main{max-width:980px;margin:0 auto;padding:18px 16px 150px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;margin:26px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--or);color:var(--on-or);border-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px}
.card{position:relative;text-align:left}
.card .meta{margin-top:8px;font-weight:600;font-size:14px;line-height:1.25}
.card .meta small{display:block;color:var(--mut);font-weight:400}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or)}
.cover{position:relative;aspect-ratio:2/3;border-radius:6px 12px 12px 6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff;
  background:radial-gradient(circle at 78% 20%,hsl(var(--h) 100% 62%) 0 16%,transparent 17%),linear-gradient(calc(150deg + var(--r)*18deg),hsl(var(--h) 100% 50%) 0%,hsl(var(--h) 100% 36%) 42%,#000 100%);
  box-shadow:var(--shadow);border-left:5px solid rgba(0,0,0,.45)}
.cover span{font-weight:800;font-size:clamp(14px,3.6vw,18px);line-height:1.1;letter-spacing:-.01em}
.cover i{font-style:normal;font-size:12px;opacity:.85;margin-top:4px}
.cover .bd{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;background:#000;display:grid;place-items:center;color:var(--or2)}
.cover .bd svg{width:16px;height:16px}
.rm{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.rm svg{width:15px;height:15px}
.rm.armed{width:auto;padding:0 10px;background:#b00020}
.cont{display:flex;gap:18px;align-items:center;background:#000;color:#FFF1E4;border-radius:18px;padding:16px;border:1px solid var(--or);box-shadow:var(--shadow);width:100%;text-align:left}
.cont .cover{width:92px;flex:none;box-shadow:none}
.cont h3{font-size:22px;font-weight:800;line-height:1.1}
.cont p{margin:4px 0 12px;color:#c9b8a6}
.cont .bar{background:#333;max-width:260px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--or);color:var(--on-or);font-weight:800;border-radius:999px;padding:10px 18px}
.list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.row .cover{width:58px;flex:none;padding:6px;border-left-width:3px}
.row .cover span{font-size:9px}.row .cover i{display:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:800;font-size:17px;line-height:1.2}
.row .t small{color:var(--mut)}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.btn{padding:10px 16px;border-radius:999px;font-weight:800;background:var(--or);color:var(--on-or);white-space:nowrap}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.empty{padding:34px 18px;border:1.5px dashed var(--line);border-radius:18px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.links{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.links a{color:var(--ink);font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;background:var(--surface)}
.links a:hover{border-color:var(--or)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.tab{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;font-size:12px;font-weight:600;color:var(--mut)}
.tab.on{color:var(--or);background:var(--chip)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:26;width:58px;height:58px;border-radius:50%;background:var(--or);color:var(--on-or);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab svg{width:28px;height:28px;stroke-width:2.4}
#reader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#reader[hidden],#sheet[hidden]{display:none}
.rtop{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rtop .ttl{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .ib{width:38px;height:38px}
.rscroll{flex:1;overflow-y:auto;padding:26px 20px 40px;-webkit-overflow-scrolling:touch}
.page{max-width:640px;margin:0 auto;font-family:'Literata',Georgia,'Times New Roman',serif;font-size:var(--fs);line-height:1.75}
.page p{margin:0 0 1.1em;padding:2px 8px;margin-left:-8px;margin-right:-8px;border-radius:8px;transition:background .2s}
.page p.say{background:color-mix(in srgb,var(--or) 28%,transparent)}
.dock{border-top:1px solid var(--line);padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.prog{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--or)}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.ctl .play{width:54px;height:54px;border-radius:50%;background:var(--or);color:var(--on-or);display:grid;place-items:center}
.ctl .play svg{width:26px;height:26px;fill:currentColor;stroke:none}
.ctl .sk{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
select,input[type=text]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.ctl select{width:auto;padding:8px}
.pct{font-size:13px;color:var(--mut);min-width:42px}
.aud{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px}
.aud .cover{width:min(60vw,240px)}
.aud h3{font-size:24px;font-weight:800;text-align:center}
.seek{width:min(86vw,420px)}
.seek input{width:100%;accent-color:var(--or)}
.seek div{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sh h2{margin:0 0 14px}
.sh label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.drop{display:flex!important;align-items:center;justify-content:center;gap:10px;text-align:center;padding:22px 14px;border:1.5px dashed var(--or);border-radius:16px;cursor:pointer;color:var(--ink)}
.drop input{display:none}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.spot{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.note{color:var(--mut);font-size:14px;margin:0 0 12px}
/* ---------- botões 3D ---------- */
.btn,.pill,.fab,.ctl .play,.chip.on,
.ib,.chip,.btn.ghost,.ctl .sk,.links a,.tab.on,.rm{
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  will-change:transform;
}
/* laranja em relevo */
.btn,.pill,.fab,.ctl .play,.chip.on{
  background:linear-gradient(180deg,var(--or2) 0%,var(--or) 52%,var(--or3) 100%);
  color:#000; border:1px solid rgba(255,200,150,.55);
  box-shadow:
    inset 0 1.5px 0 var(--btn-hi),
    inset 0 -4px 8px rgba(0,0,0,.28),
    0 5px 0 var(--btn-edge),
    0 10px 18px rgba(255,122,26,.28);
  text-shadow:0 1px 0 rgba(255,255,255,.28);
}
.btn:hover,.pill:hover,.fab:hover,.ctl .play:hover,.chip.on:hover{transform:translateY(-2px);filter:brightness(1.08);
  box-shadow:inset 0 1.5px 0 var(--btn-hi),inset 0 -4px 8px rgba(0,0,0,.28),0 7px 0 var(--btn-edge),0 14px 22px rgba(255,122,26,.34)}
.btn:active,.pill:active,.fab:active,.ctl .play:active,.chip.on:active{transform:translateY(4px);filter:brightness(.96);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 1px 0 var(--btn-edge),0 2px 6px rgba(255,122,26,.2)}
/* preto em relevo com aro laranja */
.ib,.chip,.btn.ghost,.ctl .sk,.links a,.tab.on,.rm{
  background:var(--dk-face); color:var(--ink);
  border:1px solid color-mix(in srgb,var(--or) 55%,transparent);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.14),
    inset 0 -3px 6px rgba(0,0,0,.45),
    0 4px 0 var(--dk-edge),
    0 8px 14px rgba(0,0,0,.5);
}
.btn.ghost{color:var(--ink)}
.ib:hover,.chip:hover,.btn.ghost:hover,.ctl .sk:hover,.links a:hover,.rm:hover{
  transform:translateY(-2px);border-color:var(--or);color:var(--or2);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),inset 0 -3px 6px rgba(0,0,0,.45),0 6px 0 var(--dk-edge),0 0 16px rgba(255,122,26,.35)}
.ib:active,.chip:active,.btn.ghost:active,.ctl .sk:active,.links a:active,.rm:active{
  transform:translateY(3px);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.65),0 1px 0 var(--dk-edge)}
.chip.on{color:#000}
.rm{color:#fff}
.rm.armed{background:linear-gradient(180deg,#ff3b5c,#b00020);border-color:#ff8aa0;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 3px 0 #5a0012,0 6px 12px rgba(176,0,32,.5)}
.tab{transition:transform .12s ease}
.tab:active{transform:translateY(2px)}
.tab.on{color:var(--or2);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 -3px 6px rgba(0,0,0,.45),0 3px 0 var(--dk-edge),0 0 14px rgba(255,122,26,.25)}
.tabs{background:linear-gradient(180deg,#0d0d0d,#000);border-top:1px solid color-mix(in srgb,var(--or) 45%,transparent)}
.top{background:linear-gradient(180deg,#0d0d0d,#000);border-bottom:1px solid color-mix(in srgb,var(--or) 45%,transparent)}
.search{box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.brand{color:var(--or2);text-shadow:0 0 18px rgba(255,122,26,.45)}
.chip.on,.btn,.pill,.fab,.ctl .play{color:#000}
:root[data-theme="light"] .top,:root[data-theme="light"] .tabs{background:var(--bg)}
:root[data-theme="light"] .brand{text-shadow:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span>Leia+</div>
  <label class="search" aria-label="Buscar livros">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar título, autor ou categoria" autocomplete="off">
  </label>
  <button class="ib" id="btnSpot" aria-label="Música no Spotify"><svg viewBox="0 0 24 24" style="stroke:none;fill:#1DB954"><circle cx="12" cy="12" r="11"/><path d="M5.6 9.2c4.2-1.2 9-.8 12.8 1.4M6.4 12.5c3.6-1 7.4-.7 10.6 1.1M7.2 15.6c3-.8 5.9-.5 8.5.9" style="fill:none;stroke:#000;stroke-width:1.9"/></svg></button>
  <button class="ib" id="btnTheme" aria-label="Alternar modo noturno"></button>
</header>

<main id="view"></main>

<button class="fab" id="fab" aria-label="Adicionar livro ou arquivo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Seções">
  <button class="tab on" data-tab="lib"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h6"/></svg>Biblioteca</button>
  <button class="tab" data-tab="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explorar</button>
  <button class="tab" data-tab="audio"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>Audiolivros</button>
</nav>

<section id="reader" hidden></section>
<section id="sheet" hidden></section>
<div id="toast" role="status"></div>

<script>
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash = s => { let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h; };
const CATS = ['Clássicos','Romance','Fantasia','Terror','Mistério','Filosofia','Ciência','Negócios','Autoajuda','Poesia','Infantil','Outros'];
const ico = {
  head:'<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>'
};

/* ---------- armazenamento (com reserva em memória) ---------- */
const mem = {};
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch(e){ return k in mem ? mem[k] : d; } }
function lsSet(k, v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let dbp;
function db(){
  if (!dbp) dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('brasa-leitor', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('c');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch(e){ rej(e); }
  });
  return dbp;
}
const blobMem = {};
async function put(k, v){
  blobMem[k] = v;
  try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('c','readwrite'); t.objectStore('c').put(v,k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch(e){}
}
async function get(k){
  if (k in blobMem) return blobMem[k];
  try { const d = await db(); return await new Promise((res, rej) => { const t = d.transaction('c'); const q = t.objectStore('c').get(k); q.onsuccess = () => res(q.result||null); q.onerror = () => rej(q.error); }); } catch(e){ return null; }
}
async function del(k){ delete blobMem[k]; try { const d = await db(); d.transaction('c','readwrite').objectStore('c').delete(k); } catch(e){} }

let lib = lsGet('brasa.lib', []);
const saveLib = () => lsSet('brasa.lib', lib);

/* ---------- catálogo (textos de demonstração) ---------- */
const CAT = [
 {t:'Dom Casmurro',a:'Machado de Assis',c:'Clássicos',x:['Bentinho recorda a juventude e tenta amarrar as pontas de uma vida que lhe escapou. A casa da infância, a vizinha Capitu e a promessa feita pela mãe formam o ponto de partida da narrativa.','O narrador conta tudo com ironia e meias-verdades. Quem lê precisa decidir em quem confiar, e é aí que o livro começa a incomodar.']},
 {t:'Memórias Póstumas de Brás Cubas',a:'Machado de Assis',c:'Clássicos',x:['Um defunto autor decide contar a própria vida de dentro do túmulo, sem pressa e sem pudor. A morte, para ele, libertou da obrigação de agradar.','Entre vaidades, amores frustrados e pequenas covardias, o livro faz graça com o que a sociedade prefere não ver.']},
 {t:'Orgulho e Preconceito',a:'Jane Austen',c:'Romance',x:['Elizabeth Bennet não tem pressa de casar, e a vizinhança inteira parece ter. A chegada de um rapaz rico ao campo muda o assunto das conversas.','Primeiras impressões se mostram erradas dos dois lados. O romance cresce no espaço entre o que as pessoas dizem e o que sentem.']},

let tab = 'lib', cat = 'Todos', lang = 'all';
const LN = {pt:'Português',en:'English',es:'Español'}, LC = {pt:'pt-BR',en:'en-US',es:'es-ES'};
const view = $('#view');

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---------- tema ---------- */
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('brasa.theme', t); } catch(e){}
  $('#btnTheme').innerHTML = t==='dark' ? ico.sun : ico.moon;
  $('#btnTheme').setAttribute('aria-label', t==='dark' ? 'Ativar modo claro' : 'Ativar modo noturno');
}
(function(){
  let t=null; try { t = localStorage.getItem('brasa.theme'); } catch(e){}
  if (!t) t = 'dark';
  setTheme(t);
  try { const fs = localStorage.getItem('brasa.fs'); if (fs) document.documentElement.style.setProperty('--fs', fs+'px'); } catch(e){}
})();
$('#btnTheme').onclick = () => setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');

/* ---------- peças de interface ---------- */
function cover(b){
  const h = hash(b.title), hue = [16,22,28,34][h%4];
  return `<div class="cover" style="--h:${hue};--r:${h%3}"><span>${esc(b.title)}</span><i>${esc(b.author||'')}</i>${(b.type==='audio'||b.type==='stream')?`<b class="bd">${ico.head}</b>`:''}</div>`;
}
const chips = () => `<div class="chips" aria-label="Idioma">${[['all','Todos os idiomas'],...Object.entries(LN)].map(([k,v])=>`<button class="chip ${lang===k?'on':''}" data-act="lang" data-v="${k}">${v}</button>`).join('')}</div>` + `<div class="chips" role="tablist" aria-label="Categorias">${['Todos',...CATS].map(c=>`<button class="chip ${cat===c?'on':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
const match = (b, q) => (lang==='all'||(b.lang||b.l||'pt')===lang) && (!q || (b.title+' '+(b.author||'')+' '+(b.cat||b.c||'')).toLowerCase().includes(q));
const pct = b => Math.round((b.progress||0)*100);

function bookCard(b){
  return `<div class="card">
    <button data-act="open" data-id="${b.id}" style="width:100%;text-align:left" aria-label="Abrir ${esc(b.title)}">${cover(b)}
      <div class="meta">${esc(b.title)}<small>${esc(b.author||'Autor desconhecido')} · ${esc(b.cat)} · ${LN[b.lang||'pt']}</small></div>
      <div class="bar"><i style="width:${pct(b)}%"></i></div></button>
    <button class="rm" data-act="rm" data-id="${b.id}" aria-label="Remover ${esc(b.title)}">${ico.x}</button>
  </div>`;
}

/* ---------- telas ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab===tab));
  const q = $('#q').value.trim().toLowerCase();
  if (tab==='lib') view.innerHTML = renderLib(q);
  else if (tab==='explore') view.innerHTML = renderExplore(q);
  else view.innerHTML = renderAudio(q);
}

function renderLib(q){
  const recent = lib.filter(b=>b.last && (b.progress||0)<1).sort((a,b)=>b.last-a.last)[0];
  let h = '';
  if (recent && !q && cat==='Todos') {
    h += `<button class="cont" data-act="open" data-id="${recent.id}">${cover(recent)}<div><h3>${esc(recent.title)}</h3><p>${esc(recent.author||'')}</p><div class="bar"><i style="width:${pct(recent)}%"></i></div><p style="margin:10px 0 0"><span class="pill">${recent.type==='audio'?'Continuar ouvindo':'Continuar lendo'} · ${pct(recent)}%</span></p></div></button>`;
  }
  h += `<h2>Minha biblioteca</h2>` + chips();
  const items = lib.filter(b => (cat==='Todos'||b.cat===cat) && match(b,q));
  if (!lib.length) h += `<div class="empty"><b>Sua biblioteca está vazia</b>Toque no botão + para enviar um arquivo seu, ou vá em Explorar para baixar um livro.</div>`;
  else if (!items.length) h += `<div class="empty"><b>Nada encontrado</b>Tente outra busca ou escolha outra categoria.</div>`;
  else h += `<div class="grid">${items.map(bookCard).join('')}</div>`;
  return h;
}

function renderExplore(q){
  const items = CAT.map((b,i)=>({...b,i})).filter(b => (cat==='Todos'||b.c===cat) && match(b,q));
  let h = `<h2>Explorar livros</h2><p class="note">Os livros abaixo são textos de demonstração em português, inglês e espanhol. Eles ficam salvos neste aparelho depois de baixados.</p>` + chips();
  if (!items.length) h += `<div class="empty"><b>Nenhum livro com esse filtro</b>Procure nas fontes gratuitas abaixo e envie o arquivo pelo botão +.</div>`;
  else h += `<div class="list">${items.map(b => {
    const id = 'c'+b.i, have = lib.some(x=>x.id===id);
    return `<div class="row">${cover({title:b.t,author:b.a})}<div class="t"><b>${esc(b.t)}</b><small>${esc(b.a)}</small><br><span class="tag">${esc(b.c)}</span> <span class="tag">${LN[b.l||'pt']}</span></div>
      <button class="btn ${have?'ghost':''}" data-act="${have?'open':'get'}" data-id="${id}" data-i="${b.i}">${have?'Ler':'Baixar'}</button></div>`;
  }).join('')}</div>`;
  const term = encodeURIComponent($('#q').value.trim());
  h += `<div class="links">
    <a href="https://www.gutenberg.org/ebooks/search/?query=${term}" target="_blank" rel="noopener">Project Gutenberg</a>
    <a href="https://www.gutenberg.org/ebooks/search/?query=l.en+${term}" target="_blank" rel="noopener">Gutenberg · English</a>
    <a href="https://www.gutenberg.org/ebooks/search/?query=l.es+${term}" target="_blank" rel="noopener">Gutenberg · Español</a>
    <a href="https://www.cervantesvirtual.com/" target="_blank" rel="noopener">Biblioteca Cervantes (ES)</a>
    <a href="https://www.dominiopublico.gov.br/" target="_blank" rel="noopener">Domínio Público (BR)</a>
    <a href="https://openlibrary.org/search?q=${term}" target="_blank" rel="noopener">Buscar no Open Library</a></div>`;
  return h;
}

function renderAudio(q){
  const aud = lib.filter(b=>(b.type==='audio'||b.type==='stream') && match(b,q));
  const txt = lib.filter(b=>b.type!=='audio' && match(b,q));
  let h = `<h2>Audiolivros</h2><p class="note">Ouça de fontes online: cole um link do YouTube ou de um áudio, ou busque audiolivros gratuitos em português, inglês e espanhol.</p><div class="links" style="margin:0 0 14px"><button class="btn" data-act="src">Colar link (YouTube ou áudio)</button><button class="btn ghost" data-act="lv">Buscar audiolivros grátis</button></div>` + chips();
  h += aud.length ? `<div class="grid">${aud.map(bookCard).join('')}</div>`
    : `<div class="empty"><b>Nenhum audiolivro ainda</b>Use os botões acima ou envie um MP3, M4A ou WAV pelo botão +.</div>`;
  h += `<h2>Ouvir um livro em voz alta</h2><p class="note">A voz do aparelho lê o texto e destaca o parágrafo atual.</p>`;
  h += txt.length ? `<div class="list">${txt.map(b=>`<div class="row">${cover(b)}<div class="t"><b>${esc(b.title)}</b><small>${esc(b.author||'')}</small><br><span class="tag">${esc(b.cat)}</span></div><button class="btn" data-act="speak" data-id="${b.id}">Ouvir</button></div>`).join('')}</div>`
    : `<div class="empty">Adicione um livro de texto para ouvir em voz alta.</div>`;
  return h;
}

function splitText(t){
  let p = t.replace(/\r/g,'').split(/\n\s*\n/).map(s=>s.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);
  if (p.length < 4) p = t.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
  return p;
}
function norm(path){ const out=[]; path.split('/').forEach(s=>{ if (s==='..') out.pop(); else if (s!=='.' && s!=='') out.push(s); }); return out.join('/'); }
async function parseEpub(buf){
  if (!window.JSZip) throw new Error('Leitor de EPUB ainda carregando. Tente de novo.');
  const zip = await JSZip.loadAsync(buf), P = new DOMParser();
  const rd = p => zip.file(p).async('string');
  const cont = P.parseFromString(await rd('META-INF/container.xml'), 'application/xml');
  const opfPath = cont.querySelector('rootfile').getAttribute('full-path');
  const opf = P.parseFromString(await rd(opfPath), 'application/xml');
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')+1) : '';
  const man = {}; opf.querySelectorAll('manifest > item').forEach(i => man[i.getAttribute('id')] = i.getAttribute('href'));
  const meta = n => (opf.getElementsByTagNameNS('*', n)[0]||{}).textContent;
  const paras = [];
  for (const ref of opf.querySelectorAll('spine > itemref')) {
    const href = man[ref.getAttribute('idref')]; if (!href) continue;
    const f = zip.file(norm(base + decodeURIComponent(href.split('#')[0]))); if (!f) continue;
    const doc = P.parseFromString(await f.async('string'), 'text/html');
    doc.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,blockquote').forEach(el => {
      if (el.querySelector('p')) return;
      const t = el.textContent.replace(/\s+/g,' ').trim(); if (t) paras.push(t);
    });
  }
  return {paras, title:meta('title'), author:meta('creator')};
}
async function parsePdf(buf){
  if (!window.pdfjsLib) throw new Error('Leitor de PDF ainda carregando. Tente de novo.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({data:buf}).promise, paras = [];
  for (let n=1; n<=pdf.numPages; n++) {
    const tc = await (await pdf.getPage(n)).getTextContent();
    const text = tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
    const sents = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
    let b = ''; sents.forEach(s => { if ((b+s).length > 700 && b) { paras.push(b.trim()); b = s; } else b += s; });
    if (b.trim()) paras.push(b.trim());
  }
  if (!paras.length) throw new Error('Este PDF não tem texto selecionável (pode ser digitalizado).');
  return {paras};
}
async function saveUpload(){
  const f = $('#file').files[0]; if (!f) { toast('Escolha um arquivo primeiro.'); return; }
  const ext = f.name.split('.').pop().toLowerCase(), id = 'u'+Date.now().toString(36);
  let title = $('#ftitle').value.trim(), author = $('#fauthor').value.trim(), c = $('#fcat').value;
  const btn = $('#fsave'); btn.disabled = true; btn.textContent = 'Processando…';
  try {
    let type = 'text';
    if (f.type.startsWith('audio/') || ['mp3','m4a','wav','ogg','aac','flac'].includes(ext)) {
      type = 'audio'; await put(id, {blob:f});
    } else {
      let r;
      if (ext==='epub') r = await parseEpub(await f.arrayBuffer());
      else if (ext==='pdf') r = await parsePdf(await f.arrayBuffer());
      else if (ext==='html' || ext==='htm') {
        const d = new DOMParser().parseFromString(await f.text(), 'text/html');
        r = {paras:[...d.querySelectorAll('h1,h2,h3,p,li,blockquote')].map(e=>e.textContent.replace(/\s+/g,' ').trim()).filter(Boolean)};
      } else r = {paras: splitText(await f.text())};
      if (!r.paras.length) throw new Error('Não encontrei texto neste arquivo.');
      if (!title && r.title) title = r.title; if (!author && r.author) author = r.author;
      await put(id, {paras:r.paras});
    }
    lib.push({id, title: title || f.name, author, cat:c, lang:$('#flang').value, type, progress:0, added:Date.now()});
    saveLib(); closeSheet(); tab = type==='audio' ? 'audio' : 'lib'; cat = 'Todos'; $('#q').value=''; render();
    toast('Adicionado à biblioteca.');
  } catch(err){ btn.disabled = false; btn.textContent = 'Adicionar'; toast(err.message || 'Não consegui ler este arquivo.'); }
}

/* ---------- leitor ---------- */
const reader = $('#reader');
let ytp = null, ytT = null, cur = null, tts = {units:[], i:0, on:false, rate:1, tok:0}, saveT, audioUrl = null;

async function openBook(id, speak){
  const b = lib.find(x=>x.id===id); if (!b) return;
  if (b.type==='stream') { cur = b; b.last = Date.now(); saveLib(); if (b.kind==='yt') openYT(b); else openAudio(b, {url:b.src}); return; }
  const c = await get(id);
  if (!c) { toast('Não achei o conteúdo deste livro. Adicione o arquivo de novo.'); return; }
  cur = b; b.last = Date.now(); saveLib();
  if (b.type==='audio') openAudio(b, c); else openText(b, c.paras, speak);
}
function closeReader(){
  stopSpeech(); const a = $('#au'); if (a) a.pause();
  if (ytT) { clearInterval(ytT); ytT = null; } if (ytp) { try { ytp.destroy(); } catch(e){} ytp = null; }
  if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; } catch(e){} }
  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
  reader.hidden = true; reader.innerHTML = ''; cur = null; render();
}
const topBar = b => `<div class="rtop"><button class="ib" data-r="back" aria-label="Voltar">${ico.back}</button><div class="ttl">${esc(b.title)}</div>
  ${b.type!=='text'?'':`<button class="ib" data-r="fs-" aria-label="Diminuir letra" style="font-size:13px;font-weight:800">A</button><button class="ib" data-r="fs+" aria-label="Aumentar letra" style="font-size:19px;font-weight:800">A</button>`}
  <button class="ib" data-r="theme" aria-label="Alternar modo noturno">${document.documentElement.getAttribute('data-theme')==='dark'?ico.sun:ico.moon}</button></div>`;

reader.addEventListener('click', e => {
  const el = e.target.closest('[data-r]'); if (!el) return; const r = el.dataset.r;
  if (r==='back') closeReader();
  else if (r==='theme') { setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); el.innerHTML = document.documentElement.getAttribute('data-theme')==='dark'?ico.sun:ico.moon; }
  else if (r==='fs+' || r==='fs-') {
    const cs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 19;
    const n = Math.max(14, Math.min(34, cs + (r==='fs+'?2:-2)));
    document.documentElement.style.setProperty('--fs', n+'px'); try { localStorage.setItem('brasa.fs', n); } catch(e){}
  }
  else if (r==='play') { tts.on ? stopSpeech() : startSpeech(); }
  else if (r==='pprev') jump(-1);
  else if (r==='pnext') jump(1);
});
document.addEventListener('keydown', e => { if (e.key==='Escape') { if (!sheet.hidden) closeSheet(); else if (!reader.hidden) closeReader(); } });

function openText(b, paras, speak){
  reader.hidden = false;
  reader.innerHTML = topBar(b) + `<div class="rscroll" id="sc"><article class="page">${paras.map((p,i)=>`<p data-i="${i}">${esc(p)}</p>`).join('')}</article></div>
   <div class="dock"><div class="prog"><i id="pg"></i></div><div class="ctl">
     <span class="pct" id="pc">0%</span>
     <button class="sk" data-r="pprev" aria-label="Parágrafo anterior">${ico.prev}</button>
     <button class="play" data-r="play" id="pl" aria-label="Ouvir em voz alta">${ico.play}</button>
     <button class="sk" data-r="pnext" aria-label="Próximo parágrafo">${ico.next}</button>
     <select id="rate" aria-label="Velocidade da voz"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option></select>
   </div></div>`;
  tts = {units:buildUnits(paras), i:0, on:false, rate:1, tok:tts.tok+1};
  const sc = $('#sc');
  const upd = () => {
    const max = sc.scrollHeight - sc.clientHeight, p = max>0 ? Math.min(1, sc.scrollTop/max) : 1;
    $('#pg').style.width = (p*100)+'%'; $('#pc').textContent = Math.round(p*100)+'%';
    clearTimeout(saveT); saveT = setTimeout(()=>{ if (cur) { cur.progress = p; saveLib(); } }, 400);
  };
  sc.addEventListener('scroll', upd);
  $('#rate').onchange = e => { tts.rate = +e.target.value; if (tts.on) speakAt(tts.i); };
  requestAnimationFrame(() => requestAnimationFrame(() => { const max = sc.scrollHeight - sc.clientHeight; sc.scrollTop = (b.progress||0) * max; upd(); if (speak) startSpeech(); }));
}

/* leitura em voz alta */
function buildUnits(paras){
  const u = [];
  paras.forEach((p, pi) => {
    const parts = p.match(/[^.!?…]+[.!?…]*\s*/g) || [p]; let buf = '';
    parts.forEach(s => { if ((buf+s).length > 220 && buf) { u.push({p:pi, t:buf}); buf = s; } else buf += s; });
    if (buf.trim()) u.push({p:pi, t:buf});
  });
  return u;
}
function pickVoice(){
  const l = (cur&&cur.lang)||'pt', vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang.replace('_','-')===LC[l]) || vs.find(v=>v.lang.toLowerCase().startsWith(l)) || null;
}
function firstVisible(){
  const sc = $('#sc'), top = sc.getBoundingClientRect().top;
  const ps = sc.querySelectorAll('p');
  for (const p of ps) if (p.getBoundingClientRect().bottom > top + 20) return +p.dataset.i;
  return 0;
}
function unitFor(pi){ const k = tts.units.findIndex(u=>u.p>=pi); return k<0 ? 0 : k; }
function highlight(pi){
  const sc = $('#sc'); if (!sc) return;
  sc.querySelectorAll('p.say').forEach(p=>p.classList.remove('say'));
  const p = sc.querySelector(`p[data-i="${pi}"]`); if (p) { p.classList.add('say'); p.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function setPlayIcon(){ const b = $('#pl'); if (b) { b.innerHTML = tts.on ? ico.pause : ico.play; b.setAttribute('aria-label', tts.on ? 'Pausar leitura' : 'Ouvir em voz alta'); } }
function startSpeech(){
  if (!('speechSynthesis' in window)) { toast('Seu navegador não tem leitura em voz alta.'); return; }
  tts.on = true; setPlayIcon(); speakAt(unitFor(firstVisible()));
}
function speakAt(i){
  speechSynthesis.cancel(); const tok = ++tts.tok;
  if (i >= tts.units.length) { stopSpeech(); return; }
  tts.i = i; const u = new SpeechSynthesisUtterance(tts.units[i].t);
  u.lang = LC[(cur&&cur.lang)||'pt']; u.rate = tts.rate; const v = pickVoice(); if (v) u.voice = v;
  u.onend = () => { if (tts.on && tok===tts.tok) speakAt(i+1); };
  u.onerror = () => {};
  highlight(tts.units[i].p); speechSynthesis.speak(u);
}
function stopSpeech(){
  tts.on = false; tts.tok++; try { speechSynthesis.cancel(); } catch(e){}
  const sc = $('#sc'); if (sc) sc.querySelectorAll('p.say').forEach(p=>p.classList.remove('say'));
  setPlayIcon();
}
function jump(d){
  const pi = tts.on ? tts.units[tts.i].p : firstVisible(), n = Math.max(0, pi + d);
  const p = $(`#sc p[data-i="${n}"]`); if (!p) return;
  if (tts.on) speakAt(unitFor(n)); else p.scrollIntoView({block:'start', behavior:'smooth'});
}

/* player de audiolivro */
const fmt = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function msSet(meta, h){
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.metadata = new MediaMetadata(meta); for (const k in h) navigator.mediaSession.setActionHandler(k, h[k]); } catch(e){}
}
function openAudio(b, c){
  reader.hidden = false;
  const T = b.tracks; let k = T ? Math.min(b.trk||0, T.length-1) : 0, first = true;
  audioUrl = T ? null : (c.blob ? URL.createObjectURL(c.blob) : c.url);
  const nav = (id, ic, lb) => T ? `<button class="sk" id="${id}" aria-label="${lb}">${ic}</button>` : '';
  reader.innerHTML = topBar(b) + `<div class="aud">${cover(b)}<h3>${esc(b.title)}</h3>${T?'<div class="note" id="tn" style="margin:0"></div>':''}
    <div class="seek"><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posição"><div><span id="t1">0:00</span><span id="t2">0:00</span></div></div>
    <div class="ctl" style="flex-wrap:wrap">${nav('pt',ico.prev,'Capítulo anterior')}<button class="sk" id="b15" aria-label="Voltar 15 segundos" style="font-size:13px;font-weight:800">−15</button>
      <button class="play" id="ap" aria-label="Tocar">${ico.play}</button>
      <button class="sk" id="f15" aria-label="Avançar 15 segundos" style="font-size:13px;font-weight:800">+15</button>${nav('nt',ico.next,'Próximo capítulo')}
      <select id="ar" aria-label="Velocidade"><option value="0.8">0,8×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></div>
    <p class="note" style="text-align:center;max-width:420px">Toca em segundo plano: pode trocar de app ou bloquear a tela e usar os controles do sistema.</p>
    <audio id="au" src="${audioUrl||T[k].u}" preload="metadata"></audio></div>`;
  const a = $('#au'), sk = $('#sk');
  const lab = () => { if (T) $('#tn').textContent = `Capítulo ${k+1} de ${T.length} · ${T[k].n}`; };
  const ms = () => msSet({title: T?T[k].n:b.title, artist: b.author||'', album: b.title}, {
    play:()=>a.play(), pause:()=>a.pause(),
    seekbackward:()=>{a.currentTime=Math.max(0,a.currentTime-15)}, seekforward:()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+15)},
    previoustrack:T?()=>go(k-1):null, nexttrack:T?()=>go(k+1):null});
  const go = n => { if (!T || n<0 || n>=T.length) return; k = n; b.trk = k; b.pos = 0; first = false; a.src = T[k].u; a.play(); lab(); ms(); saveLib(); };
  const upd = () => { if (a.duration) { sk.value = a.currentTime/a.duration*1000; $('#t1').textContent = fmt(a.currentTime); b.pos = a.currentTime; b.progress = T ? (k + a.currentTime/a.duration)/T.length : a.currentTime/a.duration; } };
  a.addEventListener('loadedmetadata', () => { if (first && b.pos) a.currentTime = b.pos; first = false; $('#t2').textContent = fmt(a.duration); upd(); });
  let last = 0;
  a.addEventListener('timeupdate', () => { upd(); if (Date.now()-last > 2000) { last = Date.now(); saveLib(); } });
  a.addEventListener('pause', () => { saveLib(); $('#ap').innerHTML = ico.play; });
  a.addEventListener('play', () => { $('#ap').innerHTML = ico.pause; ms(); });
  a.addEventListener('ended', () => { if (T && k<T.length-1) go(k+1); else { b.progress = 1; saveLib(); } });
  a.addEventListener('error', () => toast('Não consegui tocar este áudio. O site pode bloquear a reprodução.'));
  $('#ap').onclick = () => a.paused ? a.play() : a.pause();
  $('#b15').onclick = () => a.currentTime = Math.max(0, a.currentTime-15);
  $('#f15').onclick = () => a.currentTime = Math.min(a.duration||0, a.currentTime+15);
  if (T) { $('#pt').onclick = () => go(k-1); $('#nt').onclick = () => go(k+1); }
  $('#ar').onchange = e => a.playbackRate = +e.target.value;
  sk.oninput = () => { if (a.duration) a.currentTime = sk.value/1000*a.duration; };
  lab(); ms();
}

/* YouTube */
function ytId(u){
  try { const p = new URL(u);
    if (p.hostname==='youtu.be') return p.pathname.slice(1,12);
    if (/(^|\.)youtube\.com$/.test(p.hostname)) return p.searchParams.get('v') || ((p.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/)||[])[2]) || null;
  } catch(e){}
  return null;
}
function loadYT(){ return new Promise(r => { if (window.YT && YT.Player) return r(); window.onYouTubeIframeAPIReady = r; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }); }
async function openYT(b){
  reader.hidden = false;
  reader.innerHTML = topBar(b) + `<div class="aud"><div style="width:min(92vw,480px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000"><div id="yt"></div></div><h3>${esc(b.title)}</h3>
    <div class="ctl" style="flex-wrap:wrap"><button class="sk" id="b15" aria-label="Voltar 15 segundos" style="font-size:13px;font-weight:800">−15</button><button class="play" id="ap" aria-label="Tocar">${ico.play}</button><button class="sk" id="f15" aria-label="Avançar 15 segundos" style="font-size:13px;font-weight:800">+15</button>
      <select id="ar" aria-label="Velocidade"><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></div>
    <p class="note" style="text-align:center;max-width:420px">O YouTube costuma pausar quando você sai da página, principalmente no celular. Para ouvir com a tela bloqueada, abra no app do YouTube.</p>
    <a class="btn ghost" style="text-decoration:none" href="https://www.youtube.com/watch?v=${esc(b.vid)}" target="_blank" rel="noopener">Abrir no YouTube</a></div>`;
  try { await loadYT(); } catch(e){ toast('Não consegui carregar o YouTube.'); return; }
  if (reader.hidden) return;
  ytp = new YT.Player('yt', {width:'100%', height:'100%', videoId:b.vid, playerVars:{playsinline:1, start:Math.floor(b.pos||0)}, events:{
    onStateChange: e => { const ap = $('#ap'); if (ap) ap.innerHTML = e.data===1 ? ico.pause : ico.play; if (e.data===0) { b.progress = 1; saveLib(); } },
    onError: () => toast('Este vídeo não permite reprodução aqui. Use "Abrir no YouTube".')}});
  const seek = d => { try { ytp.seekTo(Math.max(0, ytp.getCurrentTime()+d), true); } catch(e){} };
  $('#ap').onclick = () => { try { ytp.getPlayerState()===1 ? ytp.pauseVideo() : ytp.playVideo(); } catch(e){} };
  $('#b15').onclick = () => seek(-15); $('#f15').onclick = () => seek(15);
  $('#ar').onchange = e => { try { ytp.setPlaybackRate(+e.target.value); } catch(e){} };
  msSet({title:b.title, artist:'YouTube'}, {play:()=>ytp.playVideo(), pause:()=>ytp.pauseVideo(), seekbackward:()=>seek(-15), seekforward:()=>seek(15)});
  ytT = setInterval(() => { try { b.pos = ytp.getCurrentTime(); const d = ytp.getDuration(); if (d) b.progress = b.pos/d; saveLib(); } catch(e){} }, 4000);
}

/* fontes online */
function srcSheet(){
  sheet.hidden = false;
  sheet.innerHTML = `<div class="sh" role="dialog" aria-label="Colar link"><h2>Ouvir de um link</h2>
    <p class="note">Aceita links do YouTube e links diretos de áudio (MP3, M4A, OGG). Alguns sites bloqueiam a reprodução fora deles.</p>
    <label for="slk">Link</label><input type="text" id="slk" placeholder="https://www.youtube.com/watch?v=…">
    <label for="stt">Título (opcional)</label><input type="text" id="stt">
    <label for="sln">Idioma</label><select id="sln">${Object.entries(LN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <div class="acts"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" id="sadd">Adicionar</button></div></div>`;
  $('#sadd').onclick = async () => {
    const u = $('#slk').value.trim(); let t = $('#stt').value.trim();
    const vid = ytId(u); let ok = false; try { ok = /^https?:$/.test(new URL(u).protocol); } catch(e){}
    if (!vid && !ok) { toast('Cole um link válido do YouTube ou de um áudio.'); return; }
    if (vid && !t) { try { const r = await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(u)); t = (await r.json()).title; } catch(e){} }
    const b = {id:'s'+Date.now().toString(36), title:t||(vid?'Vídeo do YouTube':'Áudio online'), author:vid?'YouTube':new URL(u).hostname, cat:'Outros', lang:$('#sln').value, type:'stream', kind:vid?'yt':'url', progress:0, added:Date.now()};
    if (vid) b.vid = vid; else b.src = u;
    lib.push(b); saveLib(); closeSheet(); tab = 'audio'; cat = 'Todos'; render(); toast('Adicionado aos audiolivros.');
  };
}
function lvSheet(){
  sheet.hidden = false;
  sheet.innerHTML = `<div class="sh" role="dialog" aria-label="Audiolivros grátis"><h2>Audiolivros grátis</h2>
    <p class="note">Gravações de domínio público do LibriVox, hospedadas no Internet Archive.</p>
    <label for="lvq">Título ou autor</label><input type="text" id="lvq" placeholder="Ex.: Dom Casmurro, Sherlock, Quijote" value="${esc($('#q').value)}">
    <label for="lvl">Idioma</label><select id="lvl">${Object.entries(LN).map(([k,v])=>`<option value="${k}" ${lang===k?'selected':''}>${v}</option>`).join('')}</select>
    <div class="acts"><button class="btn ghost" data-act="close">Fechar</button><button class="btn" id="lvgo">Buscar</button></div><div class="list" id="lvr" style="margin-top:16px"></div></div>`;
  const out = $('#lvr');
  $('#lvgo').onclick = async () => {
    const q = $('#lvq').value.trim().replace(/["()]/g,' '), l = $('#lvl').value; if (!q) { toast('Digite um título ou autor.'); return; }
    out.innerHTML = '<p class="note">Buscando…</p>';
    try {
      const qs = `collection:librivoxaudio AND language:${LN[l]==='English'?'English':LN[l]==='Español'?'Spanish':'Portuguese'} AND (title:(${q}) OR creator:(${q}))`;
      const r = await fetch('https://archive.org/advancedsearch.php?output=json&rows=12&fl[]=identifier&fl[]=title&fl[]=creator&q='+encodeURIComponent(qs));
      const docs = (await r.json()).response.docs;
      if (!docs.length) { out.innerHTML = '<p class="note">Nada encontrado. Tente outro nome ou idioma.</p>'; return; }
      out.innerHTML = docs.map((d,i)=>`<div class="row"><div class="t"><b>${esc(d.title)}</b><small>${esc([].concat(d.creator||'').join(', '))}</small></div><button class="btn" data-i="${i}">Adicionar</button></div>`).join('');
      out.onclick = async e => {
        const bt = e.target.closest('button[data-i]'); if (!bt) return; const d = docs[+bt.dataset.i]; bt.disabled = true; bt.textContent = '…';
        try {
          const m = await (await fetch('https://archive.org/metadata/'+d.identifier)).json();
          let f = m.files.filter(x=>/\.mp3$/i.test(x.name)); const pick = f.filter(x=>/128/.test(x.format||'')); if (pick.length) f = pick; else { const v = f.filter(x=>/VBR/.test(x.format||'')); if (v.length) f = v; }
          f.sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}));
          if (!f.length) throw 0;
          lib.push({id:'a'+Date.now().toString(36), title:d.title, author:[].concat(d.creator||'').join(', '), cat:'Outros', lang:l, type:'stream', kind:'pl', tracks:f.map((x,n)=>({n:x.title||('Faixa '+(n+1)), u:`https://archive.org/download/${d.identifier}/${encodeURIComponent(x.name)}`})), progress:0, added:Date.now()});
          saveLib(); closeSheet(); tab = 'audio'; cat = 'Todos'; render(); toast('Audiolivro adicionado.');
        } catch(err){ bt.disabled = false; bt.textContent = 'Adicionar'; toast('Não consegui carregar os capítulos.'); }
      };
    } catch(err){ out.innerHTML = '<p class="note">Não consegui buscar agora. Verifique a conexão.</p>'; }
  };
}

render();
</script>
